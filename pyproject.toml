[project]
name = "google-style-py"
version = "0.1.0"
description = "Easily list, connect, and delete ssh config hosts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["rich>=13.0"]

[project.scripts]
sshc = "sshc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sshc"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14"]

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
testpaths = ["sshc_test"]
